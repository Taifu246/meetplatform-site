<title>Meetplatform Werkomgeving</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: app-shell met zijbalk (beheer) en werkvlak per project met tabbladen, zelfde huisstijl als de productwebsite. */
:root {
  --paper: #EEF1EE;
  --sheet: #FAFBF9;
  --sunk: #E6EAE7;
  --ink: #16201B;
  --muted: #56635C;
  --line: #D3DAD5;
  --grid: #E4E9E5;
  --accent: #2346C4;
  --accent-soft: #E3E9FB;
  --on-accent: #FFFFFF;
  --warn: #A9560A;
  --warn-soft: #FBEBD9;
  --bad: #B42318;
  --bad-soft: #FBE3E0;
  --ok: #1E7449;
  --ok-soft: #DDF1E5;
  --cmd-bg: #1B2420;
  --cmd-fg: #CFE0D6;
  --side: #16201B;
  --side-fg: #C9D3CD;
  --side-muted: #85938B;
  --side-hover: #24302A;
  --l-buiten: #16201B;
  --l-binnen: #0B7480;
  --l-kozijn: #7B44C4;
  --l-deur: #AE2F63;
  --l-hulp: #8C978F;
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12171B; --sheet: #192026; --sunk: #141A1F; --ink: #E4EAE6; --muted: #98A49D; --line: #2B343B; --grid: #1F272D;
    --accent: #8CA4FF; --accent-soft: #232D4D; --on-accent: #0E1430;
    --warn: #F2A54E; --warn-soft: #3A2A17; --bad: #FF8A7A; --bad-soft: #3B1E1B; --ok: #62CF94; --ok-soft: #173326;
    --cmd-bg: #0C1012; --cmd-fg: #BFD3C7;
    --side: #0D1114; --side-fg: #C9D3CD; --side-muted: #7C8982; --side-hover: #1A2228;
    --l-buiten: #E4EAE6; --l-binnen: #3FC3CF; --l-kozijn: #B58CF0; --l-deur: #F07AA8; --l-hulp: #6E7A73;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12171B; --sheet: #192026; --sunk: #141A1F; --ink: #E4EAE6; --muted: #98A49D; --line: #2B343B; --grid: #1F272D;
  --accent: #8CA4FF; --accent-soft: #232D4D; --on-accent: #0E1430;
  --warn: #F2A54E; --warn-soft: #3A2A17; --bad: #FF8A7A; --bad-soft: #3B1E1B; --ok: #62CF94; --ok-soft: #173326;
  --cmd-bg: #0C1012; --cmd-fg: #BFD3C7;
  --side: #0D1114; --side-fg: #C9D3CD; --side-muted: #7C8982; --side-hover: #1A2228;
  --l-buiten: #E4EAE6; --l-binnen: #3FC3CF; --l-kozijn: #B58CF0; --l-deur: #F07AA8; --l-hulp: #6E7A73;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); }
.num { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.muted { color: var(--muted); }

/* ---------- Shell ---------- */
.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
.side {
  background: var(--side); color: var(--side-fg); display: flex; flex-direction: column; gap: 22px;
  padding-block: 18px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.brand { display: grid; gap: 2px; padding: 4px 8px; }
.brand b { font-family: var(--f-display); font-stretch: 118%; font-weight: 800; font-size: 1.08rem; color: var(--side-fg); }
.brand span { font-family: var(--f-mono); font-size: 0.7rem; color: var(--side-muted); }
.side nav { display: grid; gap: 2px; }
.side h6 {
  margin: 0 0 6px; padding: 0 8px; font: 500 0.68rem var(--f-mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--side-muted);
}
.side a {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 6px;
  color: var(--side-fg); text-decoration: none; font-size: 0.92rem;
}
.side a:hover { background: var(--side-hover); }
.side a.active { background: var(--side-hover); box-shadow: inset 2px 0 0 var(--accent); }
.side .count { font-family: var(--f-mono); font-size: 0.72rem; color: var(--side-muted); }
.side-status { margin-top: auto; display: grid; gap: 8px; padding: 12px 10px; border-top: 1px solid var(--side-hover); font-size: 0.8rem; }
.side-status div { display: flex; align-items: center; gap: 8px; color: var(--side-muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
  padding-block: 12px; padding-left: 28px; padding-right: max(28px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--sheet);
}
.crumbs { display: flex; gap: 8px; align-items: center; font-size: 0.88rem; color: var(--muted); flex-wrap: wrap; min-width: 0; }
.crumbs b { color: var(--ink); font-weight: 600; }
.top-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.search {
  background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; width: 240px; max-width: 100%;
}
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 0.84rem; color: var(--muted); cursor: pointer; white-space: nowrap; }

.content { padding-block: 24px 48px; padding-left: 28px; padding-right: max(28px, env(safe-area-inset-right, 0px)); display: grid; gap: 22px; align-content: start; }

/* ---------- Ontwikkelstatus ---------- */
.dev {
  display: inline-flex; align-items: center; font: 500 0.66rem var(--f-mono); text-transform: uppercase; letter-spacing: 0.06em;
  padding: 2px 7px; border-radius: 4px; white-space: nowrap; vertical-align: middle;
}
.dev-pro { color: var(--muted); border: 1px solid var(--line); }
.dev-new { color: var(--accent); border: 1px dashed var(--accent); }
.side .dev-pro { color: var(--side-muted); border-color: var(--side-hover); }
.side .dev-new { color: var(--accent); }
body.no-dev .dev { display: none; }

/* ---------- Koppen en tabs ---------- */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-head h1 { margin: 0; font-family: var(--f-display); font-stretch: 112%; font-weight: 750; font-size: 1.75rem; letter-spacing: -0.015em; text-wrap: balance; }
.page-head p { margin: 4px 0 0; color: var(--muted); }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs a {
  padding: 10px 14px; text-decoration: none; color: var(--muted); font-weight: 500; font-size: 0.92rem; white-space: nowrap;
  border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 8px; align-items: center;
}
.tabs a:hover { color: var(--ink); }
.tabs a.active { color: var(--ink); border-bottom-color: var(--accent); }

/* ---------- Bouwstenen ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 6px; cursor: pointer;
  font-weight: 600; font-size: 0.88rem; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); text-decoration: none;
}
.btn:hover { border-color: var(--muted); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { filter: brightness(1.07); border-color: var(--accent); }
.btn-sm { padding: 5px 10px; font-size: 0.8rem; font-weight: 500; }

.card { background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.card-head h2, .card-head h3 { margin: 0; font-family: var(--f-display); font-stretch: 108%; font-weight: 700; font-size: 1.02rem; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.card-body { padding: 16px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.grid-main { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; align-items: start; }

.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 4px; }
.tile small { color: var(--muted); font-size: 0.8rem; }
.tile strong { font-family: var(--f-display); font-stretch: 110%; font-weight: 720; font-size: 1.55rem; font-variant-numeric: tabular-nums; }
.tile span { font-size: 0.8rem; color: var(--muted); }
.tile.warn { box-shadow: inset 0 3px 0 var(--warn); }

.chip { display: inline-block; font-size: 0.72rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.chip-ok { color: var(--ok); background: var(--ok-soft); }
.chip-warn { color: var(--warn); background: var(--warn-soft); }
.chip-bad { color: var(--bad); background: var(--bad-soft); }
.chip-info { color: var(--accent); background: var(--accent-soft); }
.chip-mute { color: var(--muted); background: var(--sunk); }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
th {
  text-align: left; font-weight: 500; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
  padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--sheet);
}
td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:hover { background: var(--accent-soft); }
tfoot td { font-weight: 600; border-bottom: 0; }
tfoot tr.grand td { border-top: 2px solid var(--ink); font-size: 0.95rem; }
.handle { font-family: var(--f-mono); font-size: 0.8rem; }
.laag { font-family: var(--f-mono); font-size: 0.78rem; color: var(--muted); }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 8px; }

.notice { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 10px 14px; border-radius: 0 6px 6px 0; font-size: 0.9rem; }
.notice.warn { border-left-color: var(--warn); background: var(--warn-soft); }

/* Projectkaarten */
.projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.project { text-align: left; background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 12px; cursor: pointer; }
.project:hover { border-color: var(--accent); }
.project[aria-disabled="true"] { cursor: default; }
.project[aria-disabled="true"]:hover { border-color: var(--line); }
.project h3 { margin: 0; font-family: var(--f-display); font-stretch: 108%; font-weight: 700; font-size: 1.05rem; }
.project dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 0.85rem; }
.project dt { color: var(--muted); }
.project dd { margin: 0; text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.project-top { display: flex; justify-content: space-between; gap: 8px; align-items: start; }

/* Balken */
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 0.86rem; }
.bar-track { height: 10px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; }

/* Checklist en activiteit */
.checklist { list-style: none; margin: 0; padding: 0; display: grid; }
.checklist li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 0.9rem; }
.checklist li:last-child { border-bottom: 0; }
.mark { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 0.75rem; font-weight: 700; flex: none; }
.mark.ok { background: var(--ok-soft); color: var(--ok); }
.mark.no { background: var(--warn-soft); color: var(--warn); }
.feed { list-style: none; margin: 0; padding: 0; display: grid; }
.feed li { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 0.88rem; }
.feed li:last-child { border-bottom: 0; }
.feed time { font-family: var(--f-mono); font-size: 0.78rem; color: var(--muted); }

/* Tekening */
.viewer { display: grid; grid-template-columns: minmax(0, 1fr) 260px; }
.viewer-canvas { border-right: 1px solid var(--line); min-width: 0; }
.viewer-canvas svg { display: block; width: 100%; height: auto; }
.viewer-side { display: grid; align-content: start; }
.viewer-side section { padding: 14px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.viewer-side h4 { margin: 0; font: 500 0.7rem var(--f-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.layer-row { display: flex; align-items: center; gap: 8px; font-size: 0.86rem; cursor: pointer; }
.layer-row span.laag { margin-left: auto; }
.props-list { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: 0.85rem; margin: 0; }
.props-list dt { color: var(--muted); }
.props-list dd { margin: 0; font-family: var(--f-mono); overflow-wrap: anywhere; }
.cmd { background: var(--cmd-bg); color: var(--cmd-fg); font-family: var(--f-mono); font-size: 0.76rem; line-height: 1.6; padding: 10px 14px; overflow-x: auto; border-radius: 0 0 8px 8px; }
.cmd div { white-space: pre; }

.ent { fill: none; stroke-linecap: square; transition: opacity .15s; }
.lay-WAND-BUITEN { stroke: var(--l-buiten); stroke-width: 5; }
.lay-WAND-BINNEN { stroke: var(--l-binnen); stroke-width: 3.2; }
.lay-HULPLIJN { stroke: var(--l-hulp); stroke-width: 1.6; stroke-dasharray: 10 7; }
.blk.lay-KOZIJN * { stroke: var(--l-kozijn); stroke-width: 1.8; fill: var(--sheet); }
.blk.lay-DEUR * { stroke: var(--l-deur); stroke-width: 1.6; fill: none; }
.blk .gat { fill: var(--sheet) !important; stroke: none !important; }
.hit { stroke: transparent; stroke-width: 22; fill: none; cursor: pointer; pointer-events: stroke; }
.blk .hitbox { fill: transparent !important; stroke: none !important; cursor: pointer; pointer-events: all; }
.has-sel .ent, .has-sel .blk { opacity: 0.22; }
.has-sel .ent.sel { opacity: 1; stroke: var(--accent); }
.has-sel .blk.sel { opacity: 1; }
.has-sel .blk.sel * { stroke: var(--accent); }
.verborgen { display: none; }
.dim line { stroke: var(--muted); stroke-width: 1; }
.dim text { font-family: var(--f-mono); font-size: 22px; fill: var(--muted); }
.raster-line { stroke: var(--grid); stroke-width: 1; }

/* Hoeveelheden */
details.cat { background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
details.cat + details.cat { margin-top: 10px; }
details.cat summary {
  list-style: none; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 13px 16px;
}
details.cat summary::-webkit-details-marker { display: none; }
details.cat summary::before { content: "▸"; color: var(--muted); transition: transform .15s; }
details.cat[open] summary::before { transform: rotate(90deg); }
details.cat[open] summary { border-bottom: 1px solid var(--line); }
details.cat summary b { font-weight: 600; }

/* Meetcontrole */
.issue { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 0 14px; border-bottom: 1px solid var(--line); }
.issue:last-child { border-bottom: 0; }
.issue .stripe { background: var(--warn); }
.issue.opgelost .stripe { background: var(--ok); }
.issue.geaccepteerd .stripe { background: var(--muted); }
.issue-body { padding: 12px 0; display: grid; gap: 4px; min-width: 0; }
.issue-body p { margin: 0; font-size: 0.9rem; }
.issue-meta { font-family: var(--f-mono); font-size: 0.76rem; color: var(--muted); }
.issue-actions { display: flex; gap: 6px; align-items: center; padding: 12px 16px 12px 0; flex-wrap: wrap; justify-content: flex-end; }

/* Revisies */
.diff-add { color: var(--ok); font-weight: 600; }
.diff-del { color: var(--bad); font-weight: 600; }
.diff-mod { color: var(--warn); font-weight: 600; }

/* Export */
.export-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.export-opt { display: grid; gap: 8px; align-content: start; }
.export-opt p { margin: 0; color: var(--muted); font-size: 0.88rem; }
.pdf { background: #FFFFFF; color: #1A1A1A; border: 1px solid var(--line); border-radius: 4px; padding: 26px 26px 20px; font-size: 0.72rem; box-shadow: 0 12px 28px -18px rgba(0,0,0,.45); max-width: 520px; }
.pdf h5 { margin: 0; font: 700 1rem var(--f-display); font-stretch: 110%; }
.pdf table { font-size: 0.7rem; margin-top: 12px; }
.pdf th { color: #555; background: #FFFFFF; border-bottom: 1px solid #CCCCCC; padding: 5px 6px; }
.pdf td { border-bottom: 1px solid #E5E5E5; padding: 5px 6px; }
.pdf tbody tr:hover { background: transparent; }
.pdf-foot { display: flex; justify-content: space-between; margin-top: 14px; color: #777; font-size: 0.65rem; }

/* Toast */
.toast {
  position: fixed; right: max(20px, calc(env(safe-area-inset-right, 0px) + 20px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  background: var(--ink); color: var(--paper); padding: 10px 14px; border-radius: 6px; font-size: 0.88rem; max-width: min(380px, calc(100vw - 40px));
  box-shadow: 0 10px 30px -12px rgba(0,0,0,.5); z-index: 50;
}

.form-row { display: grid; gap: 6px; }
.input, .select { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; width: 100%; }

/* ---------- Responsief ---------- */
@media (max-width: 1100px) {
  .grid-main, .viewer { grid-template-columns: minmax(0, 1fr); }
  .viewer-canvas { border-right: 0; border-bottom: 1px solid var(--line); }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px; padding-right: max(14px, env(safe-area-inset-right, 0px)); }
  .side nav { display: flex; flex-wrap: wrap; gap: 2px; }
  .side h6, .side-status, .side .count { display: none; }
  .brand { width: 100%; }
  .topbar, .content { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .grid-2, .export-grid { grid-template-columns: minmax(0, 1fr); }
  .search { width: 100%; }
}
@media (max-width: 520px) {
  .tiles { grid-template-columns: minmax(0, 1fr); }
  .bar-row { grid-template-columns: minmax(0, 1fr) auto; }
  .bar-row .bar-track { grid-column: 1 / -1; grid-row: 2; }
  .issue { grid-template-columns: 4px minmax(0, 1fr); }
  .issue-actions { grid-column: 2; justify-content: flex-start; padding: 0 0 12px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>

<div class="shell">
  <aside class="side" aria-label="Hoofdnavigatie">
    <div class="brand"><b>Meetplatform</b><span>werkomgeving · concept</span></div>
    <nav aria-label="Werk">
      <h6>Werk</h6>
      <a href="#projecten" data-nav="projecten"><span>Projecten</span><span class="dev dev-pro">prototype</span></a>
    </nav>
    <nav aria-label="Beheer">
      <h6>Beheer</h6>
      <a href="#regels" data-nav="regels"><span>Herkenningsregels</span><span class="dev dev-pro">prototype</span></a>
      <a href="#artikelen" data-nav="artikelen"><span>Artikelen en prijzen</span><span class="dev dev-new">nieuw</span></a>
      <a href="#koppeling" data-nav="koppeling"><span>AutoCAD-koppeling</span><span class="dev dev-new">nieuw</span></a>
    </nav>
    <div class="side-status">
      <div><span class="dot"></span>AutoCAD verbonden</div>
      <div><span class="dot"></span>Server en database bereikbaar</div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">

  // =====================================================
  // REKENEN

  var EPS = 0.000001;
  function lengteM(l) { return Math.hypot(l.x2 - l.x1, l.y2 - l.y1) / 1000; }
  function overlapM(a, b) {
    var vx = a.x2 - a.x1, vy = a.y2 - a.y1, la = Math.hypot(vx, vy);
    var wx = b.x2 - b.x1, wy = b.y2 - b.y1, lb = Math.hypot(wx, wy);
    if (la <= EPS || lb <= EPS) return 0;
    var dC = Math.abs(vx * (b.y1 - a.y1) - vy * (b.x1 - a.x1)) / la;
    var dD = Math.abs(vx * (b.y2 - a.y1) - vy * (b.x2 - a.x1)) / la;
    if (dC > EPS || dD > EPS) return 0;
    var ux = vx / la, uy = vy / la;
    var pC = (b.x1 - a.x1) * ux + (b.y1 - a.y1) * uy;
    var pD = (b.x2 - a.x1) * ux + (b.y2 - a.y1) * uy;

  // Status per meetcontrole (lokaal aanpasbaar)
  var issueStatus = {};

  function controles() {
    var uit = [];

  function hoeveelheden(lijnSet, blokSet) {

      '<div class="tile' + (open ? ' warn' : '') + '"><small>Controle nodig</small><strong>' + open + '</strong><span>van ' + ctrl.length + ' meldingen</span></div>' +
      '<div class="tile"><small>Calculatie excl. btw</small><strong>' + euro(calc.excl) + '</strong><span>incl. btw ' + euro(calc.incl) + '</span></div></div>';

    // Hoeveelheden per categorie
    var maxL = Math.max.apply(null, rijen.filter(function (r) { return r.dec === 3; }).map(function (r) { return r.waarde; }));

      '</div>';
    html += '<div class="card"><div class="card-head"><h2>Activiteit ' + dev(true) + '</h2><span class="muted" style="font-size:.82rem">Vandaag</span></div><div class="card-body"><ul class="feed">' + feed + '</ul></div></div>';

  // ---------- Tekening ----------
  var NS = 'http://www.w3.org/2000/svg';
  var selectie = null;
  var verborgenLagen = {};
  function sx(x) { return (x + 800) / 10; }
  function sy(y) { return (10400 - y) / 10; }
  function el(naam, attrs, ouder) {
    var e = document.createElementNS(NS, naam);

  function tekenSvg(svg, opKlik) {
    svg.textContent = '';
    var defs = el('defs', {}, svg);

    el('rect', { x: 0, y: 0, width: 1360, height: 1160, fill: 'url(#raster)' }, svg);
    var dim = el('g', { class: 'dim', 'aria-hidden': 'true' }, svg);
    var dy = sy(-900);
    el('line', { x1: sx(0), y1: dy, x2: sx(12000), y2: dy }, dim);
    [0, 5000, 12000].forEach(function (x) {
      el('line', { x1: sx(x), y1: sy(-300), x2: sx(x), y2: dy + 12 }, dim);
      el('line', { x1: sx(x) - 9, y1: dy + 9, x2: sx(x) + 9, y2: dy - 9 }, dim);
    });
    el('text', { x: sx(2500), y: dy - 10, 'text-anchor': 'middle' }, dim).textContent = '5000';
    el('text', { x: sx(8500), y: dy - 10, 'text-anchor': 'middle' }, dim).textContent = '7000';

    lijnen.forEach(function (l) {
      var g = el('g', { class: verborgenLagen[l.laag] ? 'verborgen' : '' }, svg);
      el('line', { x1: sx(l.x1), y1: sy(l.y1), x2: sx(l.x2), y2: sy(l.y2), class: 'ent lay-' + l.laag, 'data-h': l.h }, g);
      el('line', { x1: sx(l.x1), y1: sy(l.y1), x2: sx(l.x2), y2: sy(l.y2), class: 'hit' }, g)
        .addEventListener('click', function () { opKlik(l.h); });
    });
    blokken.forEach(function (b) {
      var g = el('g', { class: 'blk lay-' + b.laag + (verborgenLagen[b.laag] ? ' verborgen' : ''), 'data-h': b.h }, svg);
      var dik = b.laag === 'KOZIJN' ? 180 : 140;
      if (b.r === 'h') el('rect', { x: sx(b.x), y: sy(b.y + dik / 2), width: b.len / 10, height: dik / 10, class: 'gat' }, g);
      else el('rect', { x: sx(b.x - dik / 2), y: sy(b.y + b.len), width: dik / 10, height: b.len / 10, class: 'gat' }, g);
      if (b.laag === 'KOZIJN') {
        if (b.r === 'h') {
          el('rect', { x: sx(b.x), y: sy(b.y + 90), width: b.len / 10, height: 18 }, g);
          el('line', { x1: sx(b.x), y1: sy(b.y), x2: sx(b.x + b.len), y2: sy(b.y) }, g);
        } else {
          el('rect', { x: sx(b.x - 90), y: sy(b.y + b.len), width: 18, height: b.len / 10 }, g);
          el('line', { x1: sx(b.x), y1: sy(b.y), x2: sx(b.x), y2: sy(b.y + b.len) }, g);
        }
      } else {
        var ex = b.r === 'h' ? b.x + b.len : b.x, ey = b.r === 'h' ? b.y : b.y + b.len;
        var bx = b.x + b.zwaai[0] * b.len, by = b.y + b.zwaai[1] * b.len;
        el('line', { x1: sx(b.x), y1: sy(b.y), x2: sx(bx), y2: sy(by) }, g);
        var px = sx(ex) - sx(b.x), py = sy(ey) - sy(b.y), qx = sx(bx) - sx(b.x), qy = sy(by) - sy(b.y);
        var sweep = (px * qy - py * qx) > 0 ? 1 : 0;
        el('path', { d: 'M' + sx(ex) + ' ' + sy(ey) + ' A' + b.len / 10 + ' ' + b.len / 10 + ' 0 0 ' + sweep + ' ' + sx(bx) + ' ' + sy(by) }, g);
      }

      var x0 = b.r === 'h' ? b.x : b.x - 450, y0 = b.r === 'h' ? b.y - 450 : b.y;

  SCHERMEN.revisies = function () {
    var oud = revisieA();
    var rOud = hoeveelheden(oud.lijnen, oud.blokken), rNu = hoeveelheden(lijnen, blokken);
    var cOud = calculatie(rOud), cNu = calculatie(rNu);
    var html = projectKop('revisies');
    html += '<div class="notice">Vergelijk twee versies van de tekening. Zo zie je per element wat er bij een nieuwe revisie bij komt, verdwijnt of verandert, en wat dat kost.</div>';
    html += '<div class="card"><div class="card-head"><h2>Revisie A (12-11-2026) → Revisie B (22-11-2026) ' + dev(true) + '</h2></div><div class="table-wrap"><table><thead><tr><th>Code</th><th>Categorie</th><th class="num">Rev A</th><th class="num">Rev B</th><th class="num">Verschil</th><th class="num">Effect op calculatie</th></tr></thead><tbody>' +
      rNu.map(function (r, i) {
        var a = rOud[i].waarde, b = r.waarde, d = b - a;
        var effect = cNu.regels[i].totaal - cOud.regels[i].totaal;
        var cls = Math.abs(d) < EPS ? '' : d > 0 ? 'diff-add' : 'diff-del';
        return '<tr><td class="mono">' + r.def.code + '</td><td>' + r.def.naam + '</td><td class="num">' + fmt(a, r.dec) + ' ' + r.def.eenheid + '</td><td class="num">' + fmt(b, r.dec) + ' ' + r.def.eenheid + '</td>' +
          '<td class="num ' + cls + '">' + (d > EPS ? '+' : '') + fmt(d, r.dec) + '</td><td class="num ' + cls + '">' + (effect > 0 ? '+' : '') + euro(effect) + '</td></tr>';
      }).join('') + '</tbody><tfoot><tr class="grand"><td colspan="5">Verschil totaal excl. btw</td><td class="num">' + (cNu.excl - cOud.excl > 0 ? '+' : '') + euro(rond(cNu.excl - cOud.excl)) + '</td></tr></tfoot></table></div></div>';

    // Objectniveau
    var regels = [];
    REV_A.weg.forEach(function (h) {
      var l = lijnen.filter(function (x) { return x.h === h; })[0], b = blokken.filter(function (x) { return x.h === h; })[0];
      regels.push('<tr><td><span class="diff-add">Nieuw</span></td><td class="handle">' + h + '</td><td class="laag">' + (l ? l.laag : b.laag) + '</td><td class="num">' + (l ? fmt(lengteM(l), 3) + ' m¹' : '1 st') + '</td></tr>');
    });
    Object.keys(REV_A.anders).forEach(function (h) {
      var nu = lijnen.filter(function (x) { return x.h === h; })[0], was = Object.assign({}, nu, REV_A.anders[h]);
      regels.push('<tr><td><span class="diff-mod">Gewijzigd</span></td><td class="handle">' + h + '</td><td class="laag">' + nu.laag + '</td><td class="num">' + fmt(lengteM(was), 3) + ' → ' + fmt(lengteM(nu), 3) + ' m¹</td></tr>');
    });
    html += '<div class="card"><div class="card-head"><h3>Gewijzigde objecten ' + dev(true) + '</h3></div><div class="table-wrap"><table><thead><tr><th>Wijziging</th><th>Handle</th><th>Laag</th><th class="num">Hoeveelheid</th></tr></thead><tbody>' + regels.join('') + '</tbody></table></div></div>';
    return html;
  };

      '<div class="cmd" style="border-radius:0 0 8px 8px">' + [
        'Command: EXPORTMETINGEN',
        '[MEET] Gevonden LINE-objecten: ' + lijnen.length,
        '[MEET] Synchronisatie geslaagd: ' + lijnen.length + ' LINE-object(en).',
        'Command: _pasteclip Specify insertion point:',
        '[MEET] Wijzigingen verstuurd: 3 nieuw/hersteld, 0 gewijzigd, 0 verwijderd.',
        'Command: _.erase 3 found',
        '[MEET] Wijzigingen verstuurd: 0 nieuw/hersteld, 0 gewijzigd, 3 verwijderd.',
        'Command: (CAD:SelecteerHandles \'("2A6" "2A8"))',
        '[CAD] Geselecteerd via website: 2 object(en).'
      ].map(function (t) { return '<div>' + t.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</div>'; }).join('') + '</div></div>' +
      '<div class="card"><div class="card-head"><h2>Commando\'s in AutoCAD ' + dev(false) + '</h2></div><div class="table-wrap"><table><tbody>' +
      [['EXPORTMETINGEN', 'Volledige synchronisatie'], ['MEETSYNCAAN', 'Automatisch synchroniseren aan'], ['MEETSYNCUIT', 'Automatisch synchroniseren uit'], ['MEETDIAG', 'Tijden per stap tonen'], ['EXPORTSQL', 'Blokken tellen en versturen']]
        .map(function (c) { return '<tr><td class="mono">' + c[0] + '</td><td class="muted">' + c[1] + '</td></tr>'; }).join('') +
      '</tbody></table></div></div></div>';
    html += '<div class="grid-2"><div class="card"><div class="card-head"><h3>AutoCAD LT ' + dev(true) + '</h3></div><div class="card-body muted">Versturen zonder WinHttp, zodat de koppeling ook in AutoCAD LT 2024 en nieuwer werkt.</div></div>' +
      '<div class="card"><div class="card-head"><h3>Meerdere tekeningen ' + dev(true) + '</h3></div><div class="card-body muted">De bridge werkt voor elke geopende tekening, en een project kan meerdere tekeningen bevatten (plattegronden, doorsneden).</div></div></div>';
    return html;
  };

  // =====================================================
  // ROUTER
  // =====================================================
  var PROJECT_VIEWS = PROJECT_TABS.map(function (t) { return t.id; });
  var TITELS = { projecten: 'Projecten', regels: 'Herkenningsregels', artikelen: 'Artikelen en prijzen', koppeling: 'AutoCAD-koppeling' };

  function toon() {
    var naam = (location.hash || '#projecten').slice(1);
    if (!SCHERMEN[naam]) naam = 'projecten';
    var inProject = PROJECT_VIEWS.indexOf(naam) >= 0;
    view.innerHTML = SCHERMEN[naam]();
    if (SCHERMEN[naam].na) SCHERMEN[naam].na();
    document.getElementById('crumbs').innerHTML = inProject
      ? '<a href="#projecten" style="color:inherit">Projecten</a><span>/</span><b>Woning type A</b>'
      : '<b>' + TITELS[naam] + '</b>';
    document.querySelectorAll('[data-nav]').forEach(function (a) {
      var actief = a.dataset.nav === naam || (inProject && a.dataset.nav === 'projecten');
      a.classList.toggle('active', actief);
      if (actief) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
  }
  window.addEventListener('hashchange', function () { toon(); window.scrollTo(0, 0); });

  // Acties (niet functioneel: tonen wat er zou gebeuren)
  view.addEventListener('click', function (e) {
    var p = e.target.closest('[data-project]');
    if (p) {
      if (p.getAttribute('aria-disabled') === 'true') toast('Alleen Woning type A is uitgewerkt in dit concept.');
      else location.hash = '#overzicht';
      return;
    }
    var knop = e.target.closest('[data-actie]');
    if (!knop) return;
    var a = knop.dataset.actie;
    if (a === 'selecteer') {
      toast('Opdracht naar AutoCAD: selecteer ' + knop.dataset.h.split(',').join(', '));
    } else if (a === 'selecteer-autocad') {
      toast('Opdracht naar AutoCAD: selecteer ' + (selectie || []).join(', '));
    } else if (a === 'accepteer' || a === 'opgelost' || a === 'heropen') {
      issueStatus[knop.dataset.id] = a === 'accepteer' ? 'geaccepteerd' : a === 'opgelost' ? 'opgelost' : 'open';
      toon();
      toast(a === 'heropen' ? 'Melding staat weer open.' : a === 'accepteer' ? 'Melding geaccepteerd.' : 'Melding gemarkeerd als opgelost.');
    } else if (a === 'export') {
      toast(knop.dataset.naam + ': in dit concept wordt geen bestand gemaakt.');
    } else {
      toast('Concept: deze knop is nog niet uitgewerkt.');
    }
  });

  // Zoeken (concept)
  document.getElementById('zoek').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') toast('Zoeken is in dit concept nog niet uitgewerkt.');
  });

  // Ontwikkelstatus tonen/verbergen
  var devToggle = document.getElementById('toon-dev');
  try { if (localStorage.getItem('werkomgeving-dev') === 'uit') devToggle.checked = false; } catch (e) {}
  function pasDevToe() { document.body.classList.toggle('no-dev', !devToggle.checked); }
  devToggle.addEventListener('change', function () {
    pasDevToe();
    try { localStorage.setItem('werkomgeving-dev', devToggle.checked ? 'aan' : 'uit'); } catch (e) {}
  });
  pasDevToe();

  toon();
})();
</script>
