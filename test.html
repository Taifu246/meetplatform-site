<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schermtest</title>
<style>
  body { margin: 0; padding: 24px 16px; font: 18px/1.5 system-ui, sans-serif; background: #EEF1EE; color: #16201B; }
  h1 { font-size: 1.4rem; margin: 0 0 16px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 0; }
  dt { color: #56635C; }
  dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
  .uitslag { margin-top: 20px; padding: 14px; border-radius: 8px; font-weight: 600; }
  .goed { background: #DDF1E5; color: #1E7449; }
  .fout { background: #FBE3E0; color: #B42318; }
</style>
</head>
<body>
<h1>Schermtest</h1>
<dl>
  <dt>Paginabreedte</dt><dd id="breedte"></dd>
  <dt>Schermbreedte</dt><dd id="scherm"></dd>
  <dt>Pixelverhouding</dt><dd id="dpr"></dd>
  <dt>Browser</dt><dd id="ua"></dd>
</dl>
<div class="uitslag" id="uitslag"></div>
<script>
  var b = window.innerWidth, s = screen.width;
  document.getElementById('breedte').textContent = b + ' px';
  document.getElementById('scherm').textContent = s + ' px';
  document.getElementById('dpr').textContent = window.devicePixelRatio;
  document.getElementById('ua').textContent = navigator.userAgent;
  var u = document.getElementById('uitslag');
  if (b <= 600) { u.className = 'uitslag goed'; u.textContent = 'Goed: de telefoon bouwt de pagina op als mobiele pagina.'; }
  else { u.className = 'uitslag fout'; u.textContent = 'De pagina wordt ' + b + ' px breed opgebouwd. Waarschijnlijk staat Desktopsite aan, of het apparaat is een tablet of computer.'; }
</script>
</body>
</html>
